name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sonara/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (no code signing)
        run: |
          xcodebuild build \
            -project Sonara/Sonara.xcodeproj \
            -scheme Sonara \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Packaging $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Sonara-unsigned.ipa Payload
          ls -lh Sonara-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-unsigned-ipa
          path: Sonara-unsigned.ipa
          retention-days: 30
